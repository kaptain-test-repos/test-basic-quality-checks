name: CI

on:
  # This workflow is only meant for pull requests. The push trigger is kept
  # on purpose: every merge starts a build of main, and that build must fail
  # in "Basic Quality Checks" with "Quality checks should not run on release
  # branches." It keeps the error for this misconfiguration under test.
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    uses: kube-kaptain/buildon-github-actions/.github/workflows/basic-quality-checks.yaml@validate-gh-actions-security-efficiency-changes-07
    permissions:
      contents: write
      packages: write
      checks: write
